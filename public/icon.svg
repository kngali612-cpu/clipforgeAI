<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle for App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner Geometric Film Strip & Play Glyph -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Video Reel / Scissor Edge -->
    <rect x="32" y="48" width="320" height="288" rx="36" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-width="8" stroke-opacity="0.3" />
    
    <!-- Film Perforations -->
    <rect x="56" y="72" width="28" height="20" rx="6" fill="#818cf8" />
    <rect x="56" y="112" width="28" height="20" rx="6" fill="#818cf8" />
    <rect x="56" y="252" width="28" height="20" rx="6" fill="#818cf8" />
    <rect x="56" y="292" width="28" height="20" rx="6" fill="#818cf8" />

    <rect x="300" y="72" width="28" height="20" rx="6" fill="#818cf8" />
    <rect x="300" y="112" width="28" height="20" rx="6" fill="#818cf8" />
    <rect x="300" y="252" width="28" height="20" rx="6" fill="#818cf8" />
    <rect x="300" y="292" width="28" height="20" rx="6" fill="#818cf8" />

    <!-- Center Play / Slice Icon -->
    <polygon points="160,132 264,192 160,252" fill="url(#glyph)" />
    
    <!-- Sparkle Stars for AI -->
    <polygon points="268,76 274,96 294,102 274,108 268,128 262,108 242,102 262,96" fill="#fbbf24" />
  </g>
</svg>
