  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection failure in proxy / iframe environments
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && e.message.includes('WebSocket')) ||
          (e.error && e.error.message && e.error.message.includes('WebSocket'))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
